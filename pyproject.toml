[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "cli-fools-client"
version = "0.1.0"
description = "Terminal client for the Fools Arena server"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "websockets==17.2",
    "textual==8.2.8",
]

[project.scripts]
fools-client = "fools_client.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fools_client"]
